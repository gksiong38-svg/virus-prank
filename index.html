<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚠️ ລະບົບພົບໄວຣັສ!</title>

<!-- ຟອນສາກົນ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Noto Sans Lao', 'Noto Sans', 'Segoe UI', Arial, sans-serif;
  }

  body {
    background: #8b0000;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    text-align: center;
    color: white;
    padding: 30px;
    max-width: 600px;
    animation: shake 0.4s infinite;
  }

  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(3px, -3px); }
    50% { transform: translate(-3px, 3px); }
    75% { transform: translate(3px, 3px); }
  }

  .warning-icon {
    font-size: 5rem;
    animation: blink 0.5s infinite;
  }

  @keyframes blink {
    50% { opacity: 0.2; }
  }

  h1 {
    font-size: 2.2rem;
    font-weight: 700;
    margin: 20px 0;
    text-shadow: 2px 2px 5px black;
  }

  .scan-line {
    text-align: left;
    background: black;
    padding: 20px;
    border-radius: 10px;
    margin: 20px 0;
    font-size: 0.95rem;
    max-height: 200px;
    overflow: hidden;
  }

  .scan-line p {
    margin: 5px 0;
    opacity: 0;
    animation: fadeIn 0.3s forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .progress-container {
    background: rgba(0, 0, 0, 0.5);
    border-radius: 10px;
    height: 25px;
    margin: 20px 0;
    overflow: hidden;
    border: 2px solid white;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff0000, #ff9900);
    width: 0%;
    transition: width 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 600;
    font-size: 0.9rem;
  }

  .infected-count {
    font-size: 1.8rem;
    font-weight: 600;
    color: #ffcc00;
    margin: 15px 0;
  }

  .close-btn {
    margin-top: 20px;
    padding: 12px 30px;
    background: white;
    color: #8b0000;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1.1rem;
    font-weight: 600;
    display: none;
  }

  .fake-btn {
    margin-top: 20px;
    padding: 12px 30px;
    background: #ffcc00;
    color: #8b0000;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1.1rem;
    font-weight: 600;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .reveal {
    display: none;
    background: white;
    color: #333;
    border-radius: 15px;
    padding: 40px;
    text-align: center;
    max-width: 500px;
  }

  .reveal h2 {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 15px;
    color: #764ba2;
  }

  .reveal p {
    font-size: 1.1rem;
    font-weight: 400;
    margin-bottom: 20px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="container" id="mainScreen">
  <div class="warning-icon">☠️</div>
  <h1>ພົບໄວຣັສອັນຕະລາຍ!</h1>
  <div class="infected-count" id="infectedCount">ໄຟລ໌ຕິດເຊື້ອ: 0</div>

  <div class="scan-line" id="scanLog"></div>

  <div class="progress-container">
    <div class="progress-fill" id="progressFill">0%</div>
  </div>

  <button class="fake-btn" id="cleanBtn" onclick="startClean()">🛡️ ກຳຈັດໄວຣັສດ່ວນ!</button>
  <button class="close-btn" id="closeBtn" onclick="reveal()">ຢອກເດີໆ ກົດເບິ່ງນີ້ 😂</button>
</div>

<div class="reveal" id="revealBox">
  <h2>😂 ຫຼອກເລີຍເນາະ!</h2>
  <p>
    ບໍ່ມີໄວຣັສຫຍັງເລີຍ ນີ້ແມ່ນ <b>ຢອກ Prank</b> ທຳມະດາ<br>
    ຄອມ/ໂທລະສັບຂອງເຈົ້າ <b>ປອດໄພ 100%</b> 🎉
  </p>
  <p style="font-size: 0.9rem; opacity: 0.7;">— ຂໍໂທດທີ່ເຮັດໃຫ້ຕົກໃຈ 🙏</p>
</div>

<audio id="alarmSound" loop>
  <source src="https://www.soundjay.com/misc/sounds/alarm-clock-01.mp3" type="audio/mpeg">
</audio>

<script>
  const scanLog = document.getElementById('scanLog');
  const progressFill = document.getElementById('progressFill');
  const infectedCount = document.getElementById('infectedCount');
  const closeBtn = document.getElementById('closeBtn');
  const cleanBtn = document.getElementById('cleanBtn');

  const fakeFiles = [
    'System32/kernel.dll',
    'Documents/passwords.txt',
    'Photos/2023/vacation.jpg',
    'Downloads/setup.exe',
    'Chrome/cookies.db',
    'AppData/login_data',
    'Desktop/important.docx',
    'Pictures/screenshot.png',
    'Videos/family.mp4',
    'Contacts/backup.vcf'
  ];

  let count = 0;
  let progress = 0;
  let fileIndex = 0;

  function playAlarm() {
    const audio = document.getElementById('alarmSound');
    audio.play().catch(() => {});
  }

  function startScan() {
    playAlarm();

    const scanInterval = setInterval(() => {
      progress += Math.random() * 8 + 2;
      if (progress > 100) progress = 100;
      progressFill.style.width = progress + '%';
      progressFill.textContent = Math.floor(progress) + '%';

      if (fileIndex < fakeFiles.length) {
        const p = document.createElement('p');
        p.style.color = Math.random() > 0.5 ? '#ff5555' : '#ffcc00';
        const infected = Math.random() > 0.6;
        p.textContent = `⚠️ ກຳລັງກວດ: ${fakeFiles[fileIndex]} ... ${infected ? 'ຕິດເຊື້ອ!' : 'OK'}`;
        if (infected) {
          count++;
          infectedCount.textContent = 'ໄຟລ໌ຕິດເຊື້ອ: ' + count;
        }
        scanLog.appendChild(p);
        scanLog.scrollTop = scanLog.scrollHeight;
        fileIndex++;
      }

      if (progress >= 100) {
        clearInterval(scanInterval);
        setTimeout(() => {
          const audio = document.getElementById('alarmSound');
          audio.pause();
          closeBtn.style.display = 'inline-block';
        }, 500);
      }
    }, 400);
  }

  function startClean() {
    cleanBtn.disabled = true;
    cleanBtn.textContent = '🔄 ກຳລັງກຳຈັດ...';
    setTimeout(() => {
      cleanBtn.textContent = '❌ ກຳຈັດບໍ່ໄດ້! ຮ້າຍແຮງເກີນໄປ';
      cleanBtn.style.background = '#ff4444';
      cleanBtn.style.color = 'white';
    }, 2000);
  }

  function reveal() {
    document.getElementById('mainScreen').style.display = 'none';
    document.body.style.background = 'linear-gradient(135deg, #667eea, #764ba2)';
    document.getElementById('revealBox').style.display = 'block';
  }

  // ເລີ່ມ scan ອັດຕະໂນມັດທັນທີທີ່ໜ້າເປີດ
  window.onload = startScan;

  // ປ້ອງກັນບໍ່ໃຫ້ອອກງ່າຍ (ຫຼອກ)
  window.onbeforeunload = function () {
    return "ໄວຣັສຍັງບໍ່ຖືກກຳຈັດ! ແນ່ໃຈບໍ່ວ່າຢາກອອກ?";
  };
</script>

</body>
</html>
